<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siladon Landscape Admin</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f4ed;
    }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #21362b;
    }

    .login-panel {
      width: min(420px, 100%);
      padding: 28px;
      background: #fff;
      border: 1px solid #e5e0d5;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(32, 45, 37, 0.12);
    }

    .login-panel h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.25;
    }

    .login-panel p {
      margin: 0 0 20px;
      color: #667166;
      line-height: 1.6;
    }

    .login-panel button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: #2f6b45;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .login-panel button:hover {
      background: #245438;
    }

    .is-hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-screen" id="login-screen">
    <div class="login-panel">
      <h1>Siladon Landscape Admin</h1>
      <p>เข้าสู่ระบบก่อนแก้ไขผลงานจัดสวน</p>
      <button type="button" id="login-button">เข้าสู่ระบบด้วย Netlify Identity</button>
    </div>
  </div>

  <script>
    (function () {
      var loginScreen = document.getElementById('login-screen');
      var loginButton = document.getElementById('login-button');
      var cmsLoaded = false;
      var identityReady = false;

      function loadCms() {
        if (cmsLoaded) return;
        cmsLoaded = true;
        loginScreen.classList.add('is-hidden');

        var cmsScript = document.createElement('script');
        cmsScript.src = 'https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js';
        document.body.appendChild(cmsScript);
      }

      function openLogin() {
        if (!identityReady || !window.netlifyIdentity) return;
        window.netlifyIdentity.open('login');
      }

      function setupIdentity() {
        if (!window.netlifyIdentity) return;
        identityReady = true;
        loginButton.disabled = false;

        window.netlifyIdentity.on('init', function (user) {
          if (user) loadCms();
        });
        window.netlifyIdentity.on('login', function () {
          window.netlifyIdentity.close();
          loadCms();
        });
        window.netlifyIdentity.init({
          APIUrl: 'https://siladonlandscape.netlify.app/.netlify/identity'
        });
      }

      loginButton.disabled = true;
      loginButton.addEventListener('click', openLogin);

      var identityScript = document.createElement('script');
      identityScript.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
      identityScript.onload = setupIdentity;
      document.head.appendChild(identityScript);
    }());
  </script>
</body>
</html>
