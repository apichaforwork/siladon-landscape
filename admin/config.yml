backend:
  name: git-gateway
  branch: main
  identity_url: https://siladonlandscape.netlify.app/garden-api
  gateway_url: https://siladonlandscape.netlify.app/garden-sync/github

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "th"

collections:
  - name: "portfolio"
    label: "ผลงานจัดสวน"
    files:
      - name: "projects"
        label: "อัลบั้ม / โครงการ"
        file: "data/projects.json"
        format: "json"
        fields:
          - label: "ผลงานทั้งหมด"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} — {{fields.area}} ตร.ม."
            fields:
              - { label: "ชื่อโครงการ", name: "title", widget: "string" }
              - { label: "หมวด / หัวข้อสีเขียว", name: "category", widget: "string", required: false }
              - { label: "รูปหน้าปก", name: "cover", widget: "image" }
              - { label: "ขนาดพื้นที่ (ตร.ม.)", name: "area", widget: "number", value_type: "float", required: false }
              - { label: "งบประมาณต่ำสุด", name: "budget_min", widget: "number", value_type: "int", required: false }
              - { label: "งบประมาณสูงสุด", name: "budget_max", widget: "number", value_type: "int", required: false }
              - { label: "ระยะเวลาทำงาน", name: "duration", widget: "string", required: false }
              - { label: "รายละเอียดงาน", name: "description", widget: "text", required: false }
              - label: "Tags / รายการงาน"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "Tag", name: "tag", widget: "string" }
              - label: "Gallery รูปเพิ่มเติม"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "รูป", name: "image", widget: "image" }
              - { label: "แสดงบนเว็บไซต์", name: "visible", widget: "boolean", default: true }
